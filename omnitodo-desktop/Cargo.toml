[package]
name = "omnitodo-desktop"
version = "0.1.0"
edition = "2021"
description = "OmniTODO desktop shell (Tauri 2)"
license = "MIT"

# Built with `cargo tauri dev|build`; excluded from the root workspace so the
# headless test run stays green (needs WebView2 / WebKitGTK system libraries).
[workspace]

# Without `custom-protocol` the webview loads from `devUrl` instead of the assets
# embedded in the binary, so a hand-rolled `cargo build --release` opens a blank
# window. `tauri build` turns it on for us; when packaging by hand pass
# `--features custom-protocol` (that is what scripts/smoke-gui-xvfb.sh does).
[features]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "omnitodo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
omnitodo-core = { path = "../crates/omnitodo-core" }
omnitodo-mcp = { path = "../crates/omnitodo-mcp" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
# Windows and Linux hand a deep link to a *new* process as a CLI argument
# rather than raising an event (see the deep-link plugin's README). Without
# single-instance that second process starts a duplicate app whose URL is never
# forwarded to the window the user already has open.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
axum = "0.7"
