# 三端发布：Windows / macOS / Linux 安装包 + GitHub Release（设计 §15 / §16 P6）。
#
# 触发：推送 `v*` 标签（标签号必须与 omnitodo-desktop/tauri.conf.json 的 version 一致，
# 否则打包出来的文件名与 Release 对不上，所以第一步就校验并失败）。
# 也可以在 Actions 页面手动 workflow_dispatch：只构建并上传 artifacts，不建 Release。
#
# 与 scripts/package*.sh 的关系：脚本是「在一台机器上本地出包」的路径，本文件是它在
# CI 上的等价物，比脚本多两件事——macOS 出 universal 包（x86_64 + arm64 合并），
# 以及把三端产物汇总成一个 Release。步骤顺序与 docs/packaging.md 一致，不能颠倒：
# 前端 → 侧车 → tauri build。
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            # 原生 Windows 上 msi（WiX）与 nsis 都能出；跨平台时 msi 不行，见 docs/packaging.md。
            bundles: nsis,msi
            tauri_args: ""
            artifact: windows-bundles
            files: |
              omnitodo-desktop/target/release/bundle/nsis/*.exe
              omnitodo-desktop/target/release/bundle/msi/*.msi
          - name: macOS
            os: macos-latest
            # universal：一个 dmg 同时覆盖 Intel 与 Apple Silicon。
            bundles: dmg
            tauri_args: "--target universal-apple-darwin"
            artifact: macos-bundles
            files: |
              omnitodo-desktop/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Linux
            os: ubuntu-22.04
            # 22.04 而不是 24.04：glibc 基线更低，装出来的 deb/AppImage 兼容面更广。
            bundles: deb,appimage,rpm
            tauri_args: ""
            artifact: linux-bundles
            files: |
              omnitodo-desktop/target/release/bundle/deb/*.deb
              omnitodo-desktop/target/release/bundle/appimage/*.AppImage
              omnitodo-desktop/target/release/bundle/rpm/*.rpm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # 仓库根目录没有 package.json，缓存键只能由这两个 lockfile 决定。
          cache-dependency-path: |
            ui/package-lock.json
            omnitodo-desktop/package-lock.json

      - name: Check tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./omnitodo-desktop/tauri.conf.json').version")
          if [ "$tag" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} != omnitodo-desktop/tauri.conf.json version ${version}"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches version ${version}"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust targets for the macOS universal build
        if: matrix.name == 'macOS'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # omnitodo-desktop 是独立 workspace（根 workspace 里 exclude 了它），
          # 两个 target 目录都要缓存。
          workspaces: |
            . -> target
            omnitodo-desktop -> omnitodo-desktop/target
          key: ${{ matrix.name }}

      - name: Install Linux system dependencies
        if: matrix.name == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config file curl wget unzip \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf libssl-dev

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci --no-audit --no-fund

      - name: Build frontend (ui/dist)
        working-directory: ui
        run: npm run build

      - name: Install Tauri CLI
        working-directory: omnitodo-desktop
        run: npm ci --no-audit --no-fund

      - name: Build MCP sidecar (host target)
        if: matrix.name != 'macOS'
        run: node scripts/build-sidecar.mjs

      - name: Build MCP sidecar (universal)
        if: matrix.name == 'macOS'
        shell: bash
        run: |
          cargo build --release -p omnitodo-mcp --target x86_64-apple-darwin
          cargo build --release -p omnitodo-mcp --target aarch64-apple-darwin
          mkdir -p omnitodo-desktop/binaries
          # Tauri 按 `binaries/omnitodo-mcp-<target-triple>` 找侧车（tauri-utils
          # external_binaries 直接拼 --target 的原值），universal 构建要找的就是
          # 这个名字，所以必须是 lipo 出来的胖二进制，而不是两份单架构文件。
          lipo -create \
            target/x86_64-apple-darwin/release/omnitodo-mcp \
            target/aarch64-apple-darwin/release/omnitodo-mcp \
            -output omnitodo-desktop/binaries/omnitodo-mcp-universal-apple-darwin
          lipo -info omnitodo-desktop/binaries/omnitodo-mcp-universal-apple-darwin

      - name: Bundle installers
        working-directory: omnitodo-desktop
        shell: bash
        env:
          # .dmg 收尾会用 AppleScript 让 Finder 排布图标，无人值守的构建机上必然超时
          # (-1712)；Tauri 只在 CI 存在时跳过这一步。GitHub 本来就设了 CI，这里写明。
          CI: "true"
        run: |
          npx tauri build \
            --bundles "${{ matrix.bundles }}" \
            ${{ matrix.tauri_args }} \
            --config '{"build":{"beforeBuildCommand":""}}'

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    # 手动触发时没有标签，只出 artifacts 不建 Release。
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Windows installers
        uses: actions/download-artifact@v4
        with:
          name: windows-bundles
          path: release-assets/windows

      - name: Download macOS installers
        uses: actions/download-artifact@v4
        with:
          name: macos-bundles
          path: release-assets/macos

      - name: Download Linux installers
        uses: actions/download-artifact@v4
        with:
          name: linux-bundles
          path: release-assets/linux

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/windows/**/*
            release-assets/macos/**/*
            release-assets/linux/**/*
