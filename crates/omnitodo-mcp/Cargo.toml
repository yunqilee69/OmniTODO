[package]
name = "omnitodo-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "omnitodo-mcp"
path = "src/main.rs"

[lib]
name = "omnitodo_mcp"
path = "src/lib.rs"

[dependencies]
omnitodo-core = { path = "../omnitodo-core" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "io-std", "io-util", "net"] }
serde.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
axum = "0.7"

[dev-dependencies]
tempfile = "3"
omnitodo-core = { path = "../omnitodo-core" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
serde_json.workspace = true
sqlx.workspace = true
